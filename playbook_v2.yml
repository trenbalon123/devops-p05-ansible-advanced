---
- name: Scan targets with loop and report
  hosts: scanners
  remote_user: runner
  become: true
  gather_facts: false

  tasks:
    - name: Install NMAP
      ansible.builtin.apt:
        name: nmap
        state: present

    - name: Scan
      ansible.builtin.shell: "nmap {{ item }} -p 80 -oG -"
      loop: "{{ lookup('file', './targets.txt').splitlines() }}"
      register: scan_results
      changed_when: false

    - name: Scan results
      ansible.builtin.debug:
        msg: "{{ item.stdout_lines }}"
      loop: "{{ scan_results.results }}"
      loop_control:
        label: "{{ item.item }}"
